server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: careerpilot-backend

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/careerpilot_db}
    username: ${SPRING_DATASOURCE_USERNAME:careerpilot}
    password: ${SPRING_DATASOURCE_PASSWORD:secret_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# CareerPilot Specific Application Properties
careerpilot:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}          # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://127.0.0.1:5173"

  storage:
    upload-dir: ${UPLOAD_DIR:./uploads/resumes}
    max-file-size-mb: 5

  rate-limit:
    max-resumes-per-window: 5
    window-minutes: 10

  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      chat-model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}
      evaluator-model: ${GEMINI_EVALUATOR_MODEL:gemini-3.1-pro-preview}
      embedding-model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
      embedding-dimension: ${EMBEDDING_DIMENSION:768}
      timeout-seconds: 45
